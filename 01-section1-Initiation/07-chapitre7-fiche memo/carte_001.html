<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Gamer - Mini-Projet CSS Grid</title>
    <style>
        /* --- RESET & STYLE GÉNÉRAL --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* --- 1. LE CONTENEUR PRINCIPAL (GRID RESPONSIVE AUTOMATIQUE) --- */
        .card {
            display: grid;
            /*
        LA MAGIE DU RESPONSIVE :
        Si la carte a au moins ~500px, elle affiche 2 colonnes (min 240px chacune).
        Si elle passe sous ce seuil, tout bascule automatiquement sur 1 seule colonne.
        */
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            overflow: hidden;
            width: 100%;
            border-radius: 16px;
            background-color: #1e293b;
            border: 2px solid #334155;

            max-width: 650px;
            gap: 0;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
        }

        /* Effet d'interaction au survol */
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
        }

        /* --- 2. IMAGE DU PERSONNAGE --- */
        .card-img {
            width: 100%;
            height: 100%;
            min-height: 250px;
            object-fit: cover;
            display: block;
        }

        /* --- 3. CONTENU DU TEXTE --- */
        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .card-body h2 {
            font-size: 1.5rem;
            color: #ffffff;
        }

        .badge {
            background-color: #0284c7;
            color: #ffffff;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            /*border: 1px solid white;*/
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .description {
            color: #94a3b8;
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 1.5rem;
        }

        /* --- 4. LA GRILLE DES STATISTIQUES (GRID NIVEAU 2) --- */
        .stats {
            display: grid;
            /* 3 fractions égales = 3 colonnes parfaites côte à côte */
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 0.6rem 0.4rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box span {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .stat-box strong {
            font-size: 1.1rem;
            color: #38bdf8;
        }
    </style>
</head>

<body>

    <!-- CONTENEUR PRINCIPAL DE LA CARTE -->
    <div class="card">

        <!-- COLONNE 1 : IMAGE -->
        <img src="https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=600&auto=format&fit=crop"
            alt="Avatar Shadow Ninja" class="card-img">

        <!-- COLONNE 2 : INFORMATIONS ET STATISTIQUES -->
        <div class="card-body">
            <div>
                <div class="header-info">
                    <h2>Cyber Ninja</h2>
                    <span class="badge">Niv. 42</span>
                </div>
                <p class="description">
                    Spécialiste de l'infiltration et des attaques éclairs. Maîtrise le katana plasma et le piratage à
                    distance.
                </p>
            </div>

            <!-- SOUS-GRILLE CSS GRID POUR LES STATS -->
            <div class="stats">
                <div class="stat-box">
                    <span>Attaque</span>
                    <strong>95</strong>
                </div>
                <div class="stat-box">
                    <span>Défense</span>
                    <strong>60</strong>
                </div>
                <div class="stat-box">
                    <span>Vitesse</span>
                    <strong>120</strong>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
